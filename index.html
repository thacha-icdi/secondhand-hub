<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Secondhand</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #34495e;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 20px;
            text-decoration: none;
        }

        .welcome {
            text-align: center;
            padding: 40px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .price {
            color: #e74c3c;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }
    </style>
</head>

<body>

<header>
    <h1>🛍️ My Secondhand</h1>
    <p>ตลาดซื้อขายสินค้ามือสอง</p>
</header>

<nav>
    <a href="#">หน้าแรก</a>
    <a href="#">สินค้า</a>
    <a href="#">ขายสินค้า</a>
    <a href="#">ติดต่อเรา</a>
</nav>

<section class="welcome">

    <h2>สินค้ามือสองแนะนำ</h2>

    <div class="products">

        <div class="product">
            <h3>iPhone 13</h3>
            <p>สภาพดี ใช้งานปกติ</p>
            <p class="price">฿12,900</p>
            <button>ดูสินค้า</button>
        </div>

        <div class="product">
            <h3>MacBook Air</h3>
            <p>สภาพสวย พร้อมใช้งาน</p>
            <p class="price">฿19,900</p>
            <button>ดูสินค้า</button>
        </div>

        <div class="product">
            <h3>จักรยาน</h3>
            <p>มือสอง สภาพดี</p>
            <p class="price">฿3,500</p>
            <button>ดูสินค้า</button>
        </div>

    </div>

</section>

</body>
</html>
